<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1100">
<title>Video Appearance Study</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 0; background: #f5f5f5; color: #222;
    min-width: 1080px;
  }
  .container { max-width: 1080px; margin: 0 auto; padding: 32px; }
  .card { background: #fff; border-radius: 8px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  h1 { margin-top: 0; font-size: 24px; }
  h2 { font-size: 18px; margin: 24px 0 8px; }
  p, li { line-height: 1.6; }
  button {
    background: #1a73e8; color: #fff; border: 0; padding: 12px 24px;
    font-size: 15px; border-radius: 6px; cursor: pointer; margin-top: 16px;
  }
  button:hover { background: #1666c2; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  button.secondary { background: #fff; color: #1a73e8; border: 1px solid #1a73e8; }
  .progress-wrap { background: #e8e8e8; height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .progress-bar { background: #1a73e8; height: 100%; transition: width .25s; }
  .progress-text { font-size: 13px; color: #555; margin-bottom: 16px; }

  .trial-layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; }
  .reference-block { text-align: center; }
  .reference-block img { max-width: 100%; max-height: 240px; border: 2px solid #1a73e8; border-radius: 4px; }
  .reference-label { font-weight: 600; font-size: 13px; color: #1a73e8; margin-top: 8px; }
  .prompt-box { background: #f0f6ff; border-left: 3px solid #1a73e8; padding: 10px 14px; font-size: 14px; font-style: italic; margin-bottom: 16px; }

  .video-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 18px; }
  .video-block { text-align: center; }
  .video-block video { width: 100%; max-width: 380px; border-radius: 4px; background: #000; }
  .video-label { font-weight: 600; font-size: 15px; margin-bottom: 6px; }

  .options { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 8px; }
  .option {
    background: #fff; border: 2px solid #ddd; border-radius: 6px;
    padding: 12px 8px; text-align: center; cursor: pointer;
    font-size: 13px; transition: all .15s;
  }
  .option:hover { border-color: #1a73e8; background: #f0f6ff; }
  .option.selected { border-color: #1a73e8; background: #1a73e8; color: #fff; }

  .submit-screen { text-align: center; padding: 48px 24px; }
  .code-box { display: inline-block; font-family: monospace; font-size: 22px; background: #f0f6ff; border: 2px dashed #1a73e8; border-radius: 8px; padding: 16px 32px; margin: 16px 0; letter-spacing: 2px; }
  .error { color: #c62828; margin-top: 12px; }
  .mobile-warning { background: #fff3cd; border: 1px solid #ffc107; padding: 16px; border-radius: 6px; margin-bottom: 16px; }
</style>
</head>
<body>

<div class="container">
  <div id="app"></div>
</div>

<script src="trials.js"></script>
<script>
// ============================================================
// CONFIGURATION — edit these three values before deploying
// ============================================================
const APPS_SCRIPT_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
const COMPLETION_CODE = 'YOUR_PROLIFIC_COMPLETION_CODE';
const PROLIFIC_RETURN_URL = 'https://app.prolific.com/submissions/complete?cc=' + 'YOUR_PROLIFIC_COMPLETION_CODE';
// ============================================================

const $ = (id) => document.getElementById(id);
const app = $('app');

// --- URL params (Prolific etc.)
const url = new URL(window.location.href);
const PROLIFIC_PID = url.searchParams.get('PROLIFIC_PID') || '';
const STUDY_ID = url.searchParams.get('STUDY_ID') || '';
const SESSION_ID = url.searchParams.get('SESSION_ID') || '';

// --- localStorage keys
const LS_KEY = 'video_study_state_v1';

function rand(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(a) {
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// --- Build the full trial list (60 real + N attention checks, then shuffled)
function buildTrialList() {
  const realTrials = [];
  REFERENCES.forEach((r) => {
    // Pair 1: Ours vs Phantom
    realTrials.push({
      kind: 'real',
      ref_id: r.id,
      pair_type: 'Ours_vs_Phantom',
      ref_image: r.image,
      prompt: r.prompt,
      ours_video: r.ours,
      baseline_video: r.phantom,
    });
    // Pair 2: Ours vs VACE
    realTrials.push({
      kind: 'real',
      ref_id: r.id,
      pair_type: 'Ours_vs_VACE',
      ref_image: r.image,
      prompt: r.prompt,
      ours_video: r.ours,
      baseline_video: r.vace,
    });
  });

  // attention checks
  const acTrials = (typeof ATTENTION_CHECKS !== 'undefined' ? ATTENTION_CHECKS : []).map((ac) => ({
    kind: 'attention_check',
    ref_id: ac.id,
    pair_type: 'attention_check',
    ref_image: ac.image,
    prompt: ac.prompt,
    ours_video: ac.correct_video,   // the "correct" video (matches reference)
    baseline_video: ac.wrong_video, // the "obviously wrong" video
    correct_choice: 'ours',          // raters should pick the ours_video side
  }));

  // shuffle real trials, sprinkle ACs uniformly
  shuffle(realTrials);
  const total = realTrials.length + acTrials.length;
  const positions = [];
  for (let i = 0; i < acTrials.length; i++) {
    positions.push(Math.floor(((i+1) * total) / (acTrials.length + 1)));
  }
  const trials = [...realTrials];
  positions.forEach((pos, i) => trials.splice(pos + i, 0, acTrials[i]));

  // for each trial, randomize which side is "ours" (A=left, B=right)
  trials.forEach((t, idx) => {
    t.trial_index = idx;
    t.ours_side = Math.random() < 0.5 ? 'A' : 'B';
    t.video_a = t.ours_side === 'A' ? t.ours_video : t.baseline_video;
    t.video_b = t.ours_side === 'A' ? t.baseline_video : t.ours_video;
  });

  return trials;
}

// --- State
let state = {
  stage: 'welcome',          // welcome | instructions | trial | submit | done
  trials: null,
  trial_idx: 0,
  responses: [],             // {trial_index, response, response_time_ms, ...}
  trial_started_at: 0,
  started_at: null,
  user_agent: navigator.userAgent,
  prolific_pid: PROLIFIC_PID,
  study_id: STUDY_ID,
  session_id: SESSION_ID,
};

// --- Persistence
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
}
function load() {
  try {
    const s = localStorage.getItem(LS_KEY);
    if (!s) return false;
    const parsed = JSON.parse(s);
    // only restore if same prolific_pid
    if (parsed.prolific_pid === PROLIFIC_PID) {
      state = parsed;
      return true;
    }
  } catch(e) {}
  return false;
}
function clearState() {
  try { localStorage.removeItem(LS_KEY); } catch(e) {}
}

// --- Rendering
function render() {
  if (state.stage === 'welcome')      return renderWelcome();
  if (state.stage === 'instructions') return renderInstructions();
  if (state.stage === 'trial')        return renderTrial();
  if (state.stage === 'submit')       return renderSubmit();
  if (state.stage === 'done')         return renderDone();
}

function renderWelcome() {
  const isMobile = /Mobi|Android/i.test(navigator.userAgent) || window.innerWidth < 900;
  app.innerHTML = `
    <div class="card">
      <h1>Video Appearance Study</h1>
      ${isMobile ? '<div class="mobile-warning"><strong>Please use a desktop or laptop computer.</strong> This study compares pairs of videos side by side and requires a wide screen.</div>' : ''}
      <p>Thank you for participating. In this study you will watch pairs of short generated videos and judge which one better preserves the appearance of a reference person.</p>
      <h2>What to expect</h2>
      <ul>
        <li>About <strong>25 minutes</strong> total.</li>
        <li>You will see <strong>${(REFERENCES.length * 2 + (typeof ATTENTION_CHECKS!=='undefined'?ATTENTION_CHECKS.length:0))} trials</strong>, each comparing two videos.</li>
        <li>Your responses are anonymous; only the study data and your Prolific ID are recorded.</li>
        <li>By clicking Continue you confirm that you are 18+ and consent to participate.</li>
      </ul>
      <button id="btn-continue" ${isMobile ? 'disabled' : ''}>Continue</button>
    </div>
  `;
  $('btn-continue').onclick = () => { state.stage = 'instructions'; save(); render(); };
}

function renderInstructions() {
  app.innerHTML = `
    <div class="card">
      <h1>Task instructions</h1>
      <p>On each trial you will see:</p>
      <ul>
        <li>A <strong>reference image</strong> of a person (on the left).</li>
        <li>A short <strong>text prompt</strong> describing the scene of the video.</li>
        <li>Two short videos side by side, labeled <strong>Video A</strong> and <strong>Video B</strong>.</li>
      </ul>
      <p>Your job is to answer:</p>
      <div class="prompt-box">Which video more faithfully preserves the appearance of the person in the reference image? Consider <strong>face, hairstyle, clothing, accessories, and any other identifying details</strong>. Ignore differences in scene, camera angle, or motion that are described by the text prompt below the videos.</div>
      <p>You will choose one of five options:</p>
      <ul>
        <li><strong>A much better</strong> &mdash; Video A is clearly better than Video B</li>
        <li><strong>A slightly better</strong> &mdash; Video A is somewhat better</li>
        <li><strong>Tie</strong> &mdash; About the same</li>
        <li><strong>B slightly better</strong> &mdash; Video B is somewhat better</li>
        <li><strong>B much better</strong> &mdash; Video B is clearly better</li>
      </ul>
      <p>The videos loop automatically. Take your time, but try not to overthink each trial.</p>
      <button id="btn-start">Start the study</button>
    </div>
  `;
  $('btn-start').onclick = () => {
    if (!state.trials) {
      state.trials = buildTrialList();
      state.started_at = new Date().toISOString();
    }
    state.stage = 'trial';
    state.trial_started_at = Date.now();
    save();
    render();
  };
}

function renderTrial() {
  const t = state.trials[state.trial_idx];
  const total = state.trials.length;
  const progressPct = ((state.trial_idx) / total * 100).toFixed(1);

  app.innerHTML = `
    <div class="card">
      <div class="progress-text">Trial ${state.trial_idx + 1} of ${total}</div>
      <div class="progress-wrap"><div class="progress-bar" style="width: ${progressPct}%"></div></div>

      <div class="trial-layout">
        <div class="reference-block">
          <img src="${t.ref_image}" alt="Reference">
          <div class="reference-label">Reference person</div>
        </div>
        <div>
          <div class="prompt-box">${t.prompt}</div>
          <div class="video-row">
            <div class="video-block">
              <div class="video-label">Video A</div>
              <video src="${t.video_a}" autoplay loop muted playsinline></video>
            </div>
            <div class="video-block">
              <div class="video-label">Video B</div>
              <video src="${t.video_b}" autoplay loop muted playsinline></video>
            </div>
          </div>
          <div class="options" id="options-row">
            <div class="option" data-val="A_much">A much better</div>
            <div class="option" data-val="A_slight">A slightly better</div>
            <div class="option" data-val="tie">Tie</div>
            <div class="option" data-val="B_slight">B slightly better</div>
            <div class="option" data-val="B_much">B much better</div>
          </div>
        </div>
      </div>
    </div>
  `;
  state.trial_started_at = Date.now();

  document.querySelectorAll('.option').forEach(el => {
    el.onclick = () => {
      // visually mark
      document.querySelectorAll('.option').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      const choice = el.dataset.val;
      const rt = Date.now() - state.trial_started_at;
      recordResponse(choice, rt);
    };
  });
}

function recordResponse(choice, rt) {
  const t = state.trials[state.trial_idx];
  // map choice to signed score relative to "Ours"
  // signed: positive if rater preferred Ours
  const map = { 'A_much': 2, 'A_slight': 1, 'tie': 0, 'B_slight': -1, 'B_much': -2 };
  const raw = map[choice];
  const signed = t.ours_side === 'A' ? raw : -raw;

  state.responses.push({
    trial_index: t.trial_index,
    kind: t.kind,
    ref_id: t.ref_id,
    pair_type: t.pair_type,
    ours_side: t.ours_side,
    raw_choice: choice,
    signed_score: signed,
    response_time_ms: rt,
  });

  state.trial_idx += 1;
  save();

  if (state.trial_idx >= state.trials.length) {
    state.stage = 'submit';
  }
  setTimeout(render, 300);
}

function renderSubmit() {
  app.innerHTML = `
    <div class="card submit-screen">
      <h1>Almost done!</h1>
      <p>You have completed all trials. Click <strong>Submit</strong> below to send your responses.</p>
      <button id="btn-submit">Submit my responses</button>
      <div id="submit-error" class="error"></div>
    </div>
  `;
  $('btn-submit').onclick = doSubmit;
}

async function doSubmit() {
  const btn = $('btn-submit');
  btn.disabled = true; btn.textContent = 'Submitting...';
  $('submit-error').textContent = '';

  const payload = {
    prolific_pid: state.prolific_pid,
    study_id: state.study_id,
    session_id: state.session_id,
    started_at: state.started_at,
    submitted_at: new Date().toISOString(),
    user_agent: state.user_agent,
    completion_code: COMPLETION_CODE,
    n_trials: state.trials.length,
    responses: state.responses,
  };

  try {
    // NOTE: Apps Script web-app endpoints require no CORS preflight when content-type is text/plain
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    state.stage = 'done';
    save();
    render();
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Submit my responses';
    $('submit-error').textContent = 'Submission failed. Please check your connection and try again. (' + err.message + ')';
  }
}

function renderDone() {
  app.innerHTML = `
    <div class="card submit-screen">
      <h1>Thank you!</h1>
      <p>Your responses have been recorded.</p>
      <p>Your completion code is:</p>
      <div class="code-box">${COMPLETION_CODE}</div>
      <p><a href="${PROLIFIC_RETURN_URL}" target="_blank">Click here to return to Prolific</a> and paste this code if it does not auto-fill.</p>
      <button class="secondary" onclick="clearState(); location.reload();">Reset and restart (for testing only)</button>
    </div>
  `;
  // also try to clear so they can't accidentally re-submit
}

// --- Boot
(function boot() {
  if (typeof REFERENCES === 'undefined' || REFERENCES.length === 0) {
    app.innerHTML = '<div class="card"><h1>Setup error</h1><p>No trial data found. Make sure <code>trials.js</code> is loaded and <code>REFERENCES</code> is defined.</p></div>';
    return;
  }
  load();
  render();
})();
</script>

</body>
</html>
